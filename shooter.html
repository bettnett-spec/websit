<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Survival</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; color: #00ff00; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
            transition: opacity 0.5s ease;
            text-shadow: 0 0 10px #00ff00;
        }
        #vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 200px rgba(0,0,0,0.9);
            pointer-events: none; z-index: 1;
        }
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 4px; height: 4px; background: #00ff00;
            border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 4px #00ff00;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(0, 255, 0, 0.8);
        }
        #crosshair::before { top: -12px; left: 1px; width: 2px; height: 28px; }
        #crosshair::after { top: 1px; left: -12px; width: 28px; height: 2px; }
        
        .hud-panel {
            background: linear-gradient(135deg, rgba(0,0,0,0.8), rgba(20,20,20,0.6));
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        #controls-hint {
            position: absolute; top: 20px; left: 20px;
            border-left: 4px solid #00aaff;
            padding: 15px 20px; border-radius: 0 8px 8px 0;
        }
        #health {
            position: absolute; bottom: 20px; left: 20px;
            border-left: 4px solid #00ff00;
            padding: 15px 25px; border-radius: 0 8px 8px 0;
            font-weight: bold; font-size: 24px;
            text-shadow: 1px 1px 2px black;
            min-width: 200px;
        }
        #kill-count {
            position: absolute; top: 20px; right: 20px;
            border-right: 4px solid #ff0055;
            padding: 15px 25px; border-radius: 8px 0 0 8px;
            font-size: 32px; color: #ff0055; font-weight: 900;
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 2px;
        }
        
        #radio-container {
            position: absolute; bottom: 20px; right: 20px;
            border-right: 4px solid #aa00ff;
            padding: 15px 20px; border-radius: 8px 0 0 8px;
            text-align: right; pointer-events: auto;
        }
        #radio-title {
            font-size: 14px; font-weight: bold; margin-bottom: 10px;
            color: #aa00ff; max-width: 250px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            text-transform: uppercase; letter-spacing: 1px;
        }
        #radio-controls button {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; font-size: 16px; cursor: pointer; margin-left: 8px;
            border-radius: 4px; padding: 5px 12px; transition: all 0.2s;
        }
        #radio-controls button:hover {
            background: rgba(170,0,255,0.5); border-color: #aa00ff;
        }

        #damage-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(255,0,0,0.4) 100%);
            opacity: 0; pointer-events: none; z-index: 3;
            transition: opacity 0.15s ease-out;
        }
        .key { color: #00aaff; font-weight: bold; background: rgba(0,170,255,0.2); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
        .locked { color: #666; font-size: 0.8em; margin-left: 8px; font-style: italic; }
        .unlocked { color: #00ff00; font-weight: bold; font-size: 0.8em; margin-left: 8px; text-shadow: 0 0 5px #00ff00; }
        .weapon-slot { margin: 8px 0; transition: all 0.2s; opacity: 0.7; }
        .active-weapon { 
            color: #ffaa00; text-shadow: 0 0 10px #ffaa00; 
            font-weight: bold; transform: scale(1.05) translateX(10px); 
            opacity: 1;
        }

        #leaderboard-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(10, 10, 10, 0.95); border: 2px solid #00ff00;
            color: white; padding: 30px; border-radius: 10px; z-index: 2000;
            display: none; flex-direction: column; align-items: center;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3); min-width: 400px;
            pointer-events: auto;
        }
        #leaderboard-modal h2 { color: #ff0055; margin-top: 0; text-shadow: 2px 2px 0 #000; font-size: 36px; letter-spacing: 2px; }
        #leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 20px; margin-bottom: 20px; }
        #leaderboard-table th, #leaderboard-table td { border: 1px solid #333; padding: 10px; text-align: center; }
        #leaderboard-table th { background: #222; color: #00aaff; }
        .lb-btn { background: #00ff00; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px; font-size: 16px; }
        .lb-btn:hover { background: #00cc00; }
        .lb-btn:disabled { background: #555; cursor: not-allowed; }
        #name-input { padding: 10px; width: 60%; background: #222; border: 1px solid #555; color: white; margin-bottom: 10px; font-size: 16px; text-align: center; }
        .lb-tab {
            background: #222; color: #888; border: 2px solid #444;
            padding: 8px 16px; cursor: pointer; font-family: inherit;
            font-weight: bold; border-radius: 4px; transition: all 0.2s;
        }
        .lb-tab:hover { background: #333; color: #fff; }
        .lb-tab.active { background: #00ff00; color: #000; border-color: #00ff00; }
    </style>

<script type="importmap">

  "imports": {

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
    import { clone } from 'three/addons/utils/SkeletonUtils.js';
    import * as CANNON from 'cannon-es';

    // --- 1. CONFIGURATION ---
    const ENEMY_SCALE = 0.06;
    const PLAYER_RADIUS = 0.35;
    const WEAPON_SCALE = 0.1;
    
    // Game State
    let playerHealth = 100;
    let killCount = 0;
    let isGameOver = false;
    
    // Progression Config
    const UNLOCKS = {
        pistol: 3,
        akm: 10
    };
    
    // Weapon Positioning
    const GUN_OFFSET = { x: 0.25, y: -0.5, z: -0.6 };
    const HAND_OFFSET = { x: 0.0, y: -0.5, z: -0.6 };
    const WEAPON_ROTATION_Y = 1.57;

    const PLAYER_OPTS = {
        mass: 5,
        speed: 10,
        jumpForce: 10,
        spawn: new CANNON.Vec3(10, 3, 0)
    };

    const ASSETS = {
        map: 'map.glb',
        enemy: 'enemy.glb',
        akm: 'akm.glb', 
        pistol: 'pistol.glb',
        hands: 'hands.glb',
        // Audio
        sfx_akm: '/akm.mp3',
        sfx_pistol: '/pistol.mp3',
        sfx_enemy: '/enemy_shoot.mp3',
        sfx_ding: '/ding.mp3'
    };

    const WEAPONS = [
        { name: 'akm', modelKey: 'akm', fireRate: 100, auto: true, type: 'hitscan', id: 0 },
        { name: 'pistol', modelKey: 'pistol', fireRate: 400, auto: false, type: 'hitscan', id: 1 },
        { name: 'hands', modelKey: 'hands', fireRate: 600, auto: false, type: 'melee', range: 4, id: 2 }
    ];

    // --- Radio System ---
    const radioTracks = [
        '/music1coolforthesummer.mp3',
        '/music2mist.mp3',
        '/music3likethat.mp3',
        '/music4tellem.mp3',
        '/music5maskoff.mp3',
        '/music6timeless.mp3',
        '/music790mh.mp3',
        '/music8sky.mp3',
        '/music10af1.mp3',
        '/music11staywme.mp3',
        '/music12moonlight.mp3',
        '/music132kfreestyle.mp3'
    ];
    let currentTrackIdx = 0;
    const radioAudio = new Audio();
    radioAudio.volume = 0.2;
    radioAudio.addEventListener('ended', nextTrack);

    function playTrack(idx) {
        currentTrackIdx = idx;
        radioAudio.src = radioTracks[currentTrackIdx];
        radioAudio.play().catch(e => console.log("Audio play prevented"));
        const trackName = radioTracks[currentTrackIdx].replace('/', '').replace('.mp3', '').replace('music', '').replace(/[0-9]+/, '');
        document.getElementById('radio-title').innerText = '🎵 ' + trackName;
        document.getElementById('radio-play').innerText = '⏸';
    }

    function nextTrack() {
        currentTrackIdx = (currentTrackIdx + 1) % radioTracks.length;
        playTrack(currentTrackIdx);
    }

    function prevTrack() {
        currentTrackIdx = (currentTrackIdx - 1 + radioTracks.length) % radioTracks.length;
        playTrack(currentTrackIdx);
    }

    function toggleRadio() {
        if (radioAudio.paused) {
            if (!radioAudio.src) playTrack(currentTrackIdx);
            else {
                radioAudio.play();
                document.getElementById('radio-play').innerText = '⏸';
            }
        } else {
            radioAudio.pause();
            document.getElementById('radio-play').innerText = '▶';
        }
    }

    document.getElementById('radio-play').addEventListener('click', (e) => { e.stopPropagation(); toggleRadio(); });
    document.getElementById('radio-next').addEventListener('click', (e) => { e.stopPropagation(); nextTrack(); });
    document.getElementById('radio-prev').addEventListener('click', (e) => { e.stopPropagation(); prevTrack(); });

    // --- Globals ---
    const SECRET_KEY = 'v8$M9z!Qp2X&7L#kR5@W1nE*Jt4Y6uG';
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyddPWRAvwObhiU8OumaozF5oeT4TQaiYTVU4fDYrEkTcQ21URHC2PmfMUjKWI0DxpJ/exec';

    let playerName = "";
    let gameStarted = false;
    let scene, camera, renderer, world, controls;
    let clock, lastTime;
    let physicsBody; 
    let slipperyMat; 
    let audioListener;
    
    // Audio Buffers
    const audioBuffers = {};
    
    // Global Lists
    const enemyBodies = [];   
    const mapMeshes = [];     
    const weaponModels = {};  
    let weaponContainer; 
    let currentWeaponIdx = 2; // Start with Hands (Index 2)
    
    // Input State
    const keys = { w: false, a: false, s: false, d: false, space: false };
    let isMouseDown = false;
    let lastShootTime = 0;
    let muzzleLight;
    
    // Camera Shake
    let shakeIntensity = 0;

    // --- Initialization ---
    function init() {
        // 1. Setup Three.js
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.Fog(0x87CEEB, 10, 80);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 1000);
        
        // Audio Listener
        audioListener = new THREE.AudioListener();
        camera.add(audioListener);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 2. Setup Physics World
        world = new CANNON.World();
        world.gravity.set(0, -20, 0);
        world.solver.iterations = 20; // High precision fix

        // Frictionless Material
        slipperyMat = new CANNON.Material('slippery');
        const physicsContact = new CANNON.ContactMaterial(slipperyMat, slipperyMat, {
            friction: 0.0,
            restitution: 0.0
        });
        world.addContactMaterial(physicsContact);

        // 3. Floor
        const groundShape = new CANNON.Plane();
        const groundBody = new CANNON.Body({ mass: 0, material: slipperyMat });
        groundBody.addShape(groundShape);
        groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0); 
        world.addBody(groundBody);

        // 4. Player Setup
        setupPlayer();

        // 5. Controls
        controls = new PointerLockControls(camera, document.body);
        document.body.addEventListener('mousedown', (e) => {
            if (!gameStarted) return;
            if (e.target.closest('#radio-container') || e.target.closest('#leaderboard-modal') || e.target.closest('#start-screen')) return; 
            if(!controls.isLocked && !isGameOver) {
                e.preventDefault();
                controls.lock();
                // Resume Audio Context on interaction
                if (audioListener.context.state === 'suspended') {
                    audioListener.context.resume();
                }
            }
        });

        // 6. Load Assets
        loadAssets();

        // 7. Events
        window.addEventListener('resize', onWindowResize);
        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);
        document.addEventListener('mousedown', (e) => { 
            if (!gameStarted) return;
            if (e.target.closest('#radio-container') || e.target.closest('#leaderboard-modal') || e.target.closest('#start-screen')) return;
            isMouseDown = true; checkShoot(); 
        });
        document.addEventListener('mouseup', () => { isMouseDown = false; });

        // 8. Start Loop
        clock = new THREE.Clock();
        lastTime = performance.now();
        animate();
        
        // Initial UI Update
        updateWeaponUI();
    }

    function setupPlayer() {
        const shape = new CANNON.Sphere(PLAYER_RADIUS);
        physicsBody = new CANNON.Body({
            mass: PLAYER_OPTS.mass,
            material: slipperyMat,
            position: PLAYER_OPTS.spawn,
            fixedRotation: true,
            linearDamping: 0.9
        });
        physicsBody.addShape(shape);
        world.addBody(physicsBody);
    }

    function loadAssets() {
        const manager = new THREE.LoadingManager();
        const audioLoader = new THREE.AudioLoader(manager);
        
        // Load Audio
        audioLoader.load(ASSETS.sfx_akm, (buffer) => { audioBuffers['akm'] = buffer; });
        audioLoader.load(ASSETS.sfx_pistol, (buffer) => { audioBuffers['pistol'] = buffer; });
        audioLoader.load(ASSETS.sfx_enemy, (buffer) => { audioBuffers['enemy'] = buffer; });
        audioLoader.load(ASSETS.sfx_ding, (buffer) => { audioBuffers['ding'] = buffer; });

        manager.onLoad = () => {
            const loaderDiv = document.getElementById('loader');
            if (loaderDiv) {
                loaderDiv.style.opacity = '0';
                setTimeout(() => {
                    loaderDiv.remove();
                    document.getElementById('start-screen').style.display = 'flex';
                }, 500);
            }
            document.getElementById('start-game-btn').addEventListener('click', async () => {
                const name = document.getElementById('player-name-input').value.trim();
                if (!name) return alert("Please enter a name to play.");
                
                const btn = document.getElementById('start-game-btn');
                const originalText = btn.innerText;
                btn.innerText = "CHECKING...";
                btn.disabled = true;

                try {
                    const response = await fetch(`${SCRIPT_URL}?checkName=${encodeURIComponent(name)}`);
                    const result = await response.text();
                    
                    if (result.trim() === 'Banned') {
                        alert("Name blocked. Please choose a different name.");
                        btn.innerText = originalText;
                        btn.disabled = false;
                        return;
                    } else if (result.trim() === 'Clear') {
                        playerName = name;
                        document.getElementById('start-screen').style.display = 'none';
                        gameStarted = true;
                        
                        spawnEnemies();
                        switchWeapon(2); // Start with Hands
                        
                        if (!isGameOver) controls.lock();
                        if (audioListener.context.state === 'suspended') {
                            audioListener.context.resume();
                        }
                    } else {
                        alert("Error checking name. Please try again.");
                        btn.innerText = originalText;
                        btn.disabled = false;
                    }
                } catch (error) {
                    console.error("Name check error:", error);
                    alert("Network error checking name. Please try again.");
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            });
        };

        const gltfLoader = new GLTFLoader(manager);

        // Map
        gltfLoader.load(ASSETS.map, (gltf) => {
            const model = gltf.scene;
            scene.add(model);
            model.updateMatrixWorld(true);

            model.traverse(child => {
                if(child.isMesh) {
                    child.receiveShadow = true;
                    child.castShadow = true;
                    child.userData.isMap = true;
                    mapMeshes.push(child);

                    const geometry = child.geometry.clone();
                    geometry.applyMatrix4(child.matrixWorld);
                    const positions = geometry.attributes.position.array;
                    let indices;
                    if (geometry.index) indices = geometry.index.array;
                    else {
                        indices = new Uint32Array(positions.length / 3);
                        for(let i=0; i<indices.length; i++) indices[i] = i;
                    }

                    const shape = new CANNON.Trimesh(positions, indices);
                    const body = new CANNON.Body({ mass: 0, material: slipperyMat });
                    body.addShape(shape);
                    world.addBody(body);
                }
            });
        });

        // Weapons
        weaponContainer = new THREE.Group();
        camera.add(weaponContainer);
        scene.add(camera);

        muzzleLight = new THREE.PointLight(0xffff00, 0, 5);
        muzzleLight.position.set(0, 0.2, -1);
        weaponContainer.add(muzzleLight);

        const loadWeapon = (name, path) => {
            gltfLoader.load(path, (gltf) => {
                const model = gltf.scene;
                model.scale.set(WEAPON_SCALE, WEAPON_SCALE, WEAPON_SCALE);
                model.rotation.y = WEAPON_ROTATION_Y;
                model.visible = false;
                weaponContainer.add(model);
                weaponModels[name] = model;
            });
        };

        loadWeapon('akm', ASSETS.akm);
        loadWeapon('pistol', ASSETS.pistol);
        loadWeapon('hands', ASSETS.hands);

        // Enemy
        gltfLoader.load(ASSETS.enemy, (gltf) => {
            ASSETS.enemyModel = gltf.scene;
        });
    }

    function spawnEnemies() {
        if (!ASSETS.enemyModel) return;
        
        const halfExtents = new CANNON.Vec3(0.4, 0.9, 0.4);
        const debugGeometry = new THREE.BoxGeometry(0.8, 1.8, 0.8);
        const debugMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true });

        // Pool of 15 enemies maximum
        for (let i = 0; i < 15; i++) {
            const clonedMesh = clone(ASSETS.enemyModel);
            clonedMesh.traverse(child => { if(child.isMesh) child.castShadow = true; });

            const enemyContainer = new THREE.Group();
            enemyContainer.add(clonedMesh);
            enemyContainer.scale.set(ENEMY_SCALE, ENEMY_SCALE, ENEMY_SCALE); 
            enemyContainer.visible = false; // Start invisible
            scene.add(enemyContainer);

            const debugMesh = new THREE.Mesh(debugGeometry, debugMaterial);
            debugMesh.visible = false; 
            scene.add(debugMesh);
            
            // Positional Audio for Enemy
            const sound = new THREE.PositionalAudio(audioListener);
            enemyContainer.add(sound);

            const shape = new CANNON.Box(halfExtents);
            const body = new CANNON.Body({ mass: 60, fixedRotation: true, material: slipperyMat }); 
            body.addShape(shape);
            
            // Move to holding area
            body.position.set(0, -50, 0);
            world.addBody(body);
            
            enemyBodies.push({ 
                mesh: enemyContainer, 
                body: body, 
                debugMesh: debugMesh, 
                sound: sound,
                deadUntil: 0,
                lastShot: 0,
                spawnTime: 0,
                isBackingUp: false
            });
        }
    }

    function getValidSpawnPosition() {
        const raycaster = new THREE.Raycaster();
        const down = new THREE.Vector3(0, -1, 0);
        const up = new THREE.Vector3(0, 1, 0);
        
        const playerPos = new THREE.Vector3(physicsBody.position.x, physicsBody.position.y, physicsBody.position.z);
        
        for(let i=0; i<50; i++) {
            // Spawn in a donut shape around the player (radius 15 to 45)
            const angle = Math.random() * Math.PI * 2;
            const radius = 15 + Math.random() * 30;
            const x = playerPos.x + Math.cos(angle) * radius;
            const z = playerPos.z + Math.sin(angle) * radius;
            
            raycaster.set(new THREE.Vector3(x, 100, z), down);
            const intersects = raycaster.intersectObjects(mapMeshes, true);
            
            if (intersects.length > 0) {
                const hit = intersects[0];
                // Must be a floor (normal pointing up)
                if (hit.face && hit.face.normal.y > 0.5) {
                    let finalX = hit.point.x;
                    let finalY = hit.point.y + 1.5;
                    let finalZ = hit.point.z;
                    
                    // Check headroom to avoid spawning inside cramped buildings or clipping through roofs
                    const headroomRaycaster = new THREE.Raycaster(new THREE.Vector3(finalX, finalY, finalZ), up);
                    const headroomHits = headroomRaycaster.intersectObjects(mapMeshes, true);
                    if (headroomHits.length > 0 && headroomHits[0].distance < 1.5) {
                        continue; // Not enough headroom
                    }
                    
                    // Check horizontal clearance to avoid spawning inside walls
                    const wallRaycaster = new THREE.Raycaster();
                    const directions = [
                        new THREE.Vector3(1,0,0), new THREE.Vector3(-1,0,0),
                        new THREE.Vector3(0,0,1), new THREE.Vector3(0,0,-1)
                    ];
                    
                    let pushDir = new THREE.Vector3(0,0,0);
                    let wallHitCount = 0;
                    
                    for (let dir of directions) {
                        wallRaycaster.set(new THREE.Vector3(finalX, finalY - 0.5, finalZ), dir);
                        const wallHits = wallRaycaster.intersectObjects(mapMeshes, true);
                        if (wallHits.length > 0 && wallHits[0].distance < 1.0) {
                            pushDir.add(dir.clone().multiplyScalar(-1));
                            wallHitCount++;
                        }
                    }
                    
                    if (wallHitCount > 0) {
                        if (pushDir.lengthSq() > 0) {
                            pushDir.normalize().multiplyScalar(1.5); // Push away
                            finalX += pushDir.x;
                            finalZ += pushDir.z;
                        } else {
                            continue; // Trapped on multiple sides, try another spot
                        }
                    }
                    
                    return new CANNON.Vec3(finalX, finalY, finalZ);
                }
            }
        }
        
        // Absolute Fallback: Drop from sky near player
        return new CANNON.Vec3(playerPos.x + (Math.random() - 0.5) * 20, 20, playerPos.z + (Math.random() - 0.5) * 20);
    }

    function respawnEnemy(enemy, force = false) {
        if (Date.now() < enemy.deadUntil && !force) return;
        enemy.mesh.visible = true;
        
        // Use smart spawning logic
        const pos = getValidSpawnPosition();
        enemy.body.position.set(pos.x, pos.y, pos.z);
        enemy.body.velocity.set(0,0,0);
        enemy.body.wakeUp();
        enemy.spawnTime = Date.now();
        enemy.isBackingUp = false;
    }

    function getTargetEnemyCount(kills) {
        if (kills < 3) return 2;
        if (kills < 10) return 5;
        if (kills < 20) return 8;
        if (kills < 30) return 10;
        if (kills < 50) return 12;
        return 15;
    }

    function resetGame() {
        playerHealth = 100;
        killCount = 0;
        isGameOver = false;

        // Update HUD
        document.getElementById('hp-val').innerText = '100';
        document.getElementById('hp-bar').style.width = '100%';
        document.getElementById('hp-bar').style.background = 'linear-gradient(90deg, #00aa00, #00ff00)';
        document.getElementById('kill-count').innerText = 'KILLS: 0';
        
        // Reset Player
        physicsBody.position.set(10, 3, 0);
        physicsBody.velocity.set(0, 0, 0);
        
        // Reset Weapon
        switchWeapon(2);
        
        // Reset Enemies
        enemyBodies.forEach(e => {
            e.mesh.visible = false;
            e.deadUntil = Date.now() + Math.random() * 2000;
            e.body.position.set(0, -50, 0);
            e.body.velocity.set(0, 0, 0);
        });
    }

    function switchWeapon(index) {
        // Validation based on progression
        if (index === 0 && killCount < UNLOCKS.akm) return;
        if (index === 1 && killCount < UNLOCKS.pistol) return;
        if (index < 0 || index >= WEAPONS.length) return;

        currentWeaponIdx = index;
        const selected = WEAPONS[index];
        
        Object.values(weaponModels).forEach(m => m.visible = false);
        if (weaponModels[selected.modelKey]) {
            weaponModels[selected.modelKey].visible = true;
        }

        if (selected.name === 'hands') {
            weaponContainer.position.set(HAND_OFFSET.x, HAND_OFFSET.y, HAND_OFFSET.z);
        } else {
            weaponContainer.position.set(GUN_OFFSET.x, GUN_OFFSET.y, GUN_OFFSET.z);
        }
        
        updateWeaponUI();
    }
    
    function updateWeaponUI() {
        // Reset classes
        ['w-slot-1', 'w-slot-2', 'w-slot-3'].forEach(id => {
             document.getElementById(id).classList.remove('active-weapon');
        });
        
        // Highlight active
        const map = { 0: 'w-slot-1', 1: 'w-slot-2', 2: 'w-slot-3' };
        document.getElementById(map[currentWeaponIdx]).classList.add('active-weapon');

        // Locks
        const l1 = document.getElementById('lock-1');
        const l2 = document.getElementById('lock-2');
        
        if (killCount >= UNLOCKS.akm) {
            l1.className = 'unlocked'; l1.innerText = 'UNLOCKED';
        } else {
            l1.className = 'locked'; l1.innerText = 'LOCKED (10 Kills)';
        }
        
        if (killCount >= UNLOCKS.pistol) {
            l2.className = 'unlocked'; l2.innerText = 'UNLOCKED';
        } else {
            l2.className = 'locked'; l2.innerText = 'LOCKED (3 Kills)';
        }
    }

    function playPlayerSound(weaponName) {
        if (!audioBuffers[weaponName]) return;
        const sound = new THREE.Audio(audioListener);
        sound.setBuffer(audioBuffers[weaponName]);
        sound.setVolume(0.5);
        sound.play();
    }

    function playDingSound() {
        if (!audioBuffers['ding']) return;
        const sound = new THREE.Audio(audioListener);
        sound.setBuffer(audioBuffers['ding']);
        sound.setVolume(0.8);
        sound.play();
    }

    function checkShoot() {
        if (!controls.isLocked || isGameOver) return;
        const now = Date.now();
        const weapon = WEAPONS[currentWeaponIdx];
        
        if (now - lastShootTime > weapon.fireRate) {
            shoot(weapon);
            lastShootTime = now;
            if (weapon.auto && isMouseDown) {
                setTimeout(() => checkShoot(), weapon.fireRate);
            }
        }
    }

    function shoot(weapon) {
        // Visuals
        if (weapon.name !== 'hands') {
            muzzleLight.intensity = 2;
            setTimeout(() => muzzleLight.intensity = 0, 50);
            playPlayerSound(weapon.name);
        }
        const model = weaponModels[weapon.modelKey];
        if (model) {
            model.position.z += 0.05; 
            setTimeout(() => { model.position.z -= 0.05 }, 80);
        }

        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        raycaster.far = (weapon.name === 'hands') ? (weapon.range || 4) : 100;

        const visibleEnemies = enemyBodies.filter(e => e.mesh.visible);
        const enemyVisuals = visibleEnemies.map(e => e.mesh);
        const targets = [...mapMeshes, ...enemyVisuals];
        
        const intersects = raycaster.intersectObjects(targets, true);

        if (intersects.length > 0) {
            const hit = intersects[0];
            let obj = hit.object;
            let isMapWall = false;
            while(obj) {
                if (obj.userData.isMap) {
                    isMapWall = true;
                    break;
                }
                obj = obj.parent;
            }

            if (isMapWall) return;

            const enemy = enemyBodies.find(e => {
                let p = hit.object;
                while(p) {
                    if (p === e.mesh) return true;
                    p = p.parent;
                }
                return false;
            });

            if (enemy) {
                // Kill Enemy
                enemy.mesh.visible = false;
                enemy.deadUntil = Date.now() + 5000; // 5 seconds respawn delay
                enemy.body.position.set(0, -50, 0); 
                
                // Play Ding Sound
                playDingSound();

                // Vampirism: Heal on Kill
                playerHealth = Math.min(100, playerHealth + 30);
                document.getElementById('hp-val').innerText = Math.max(0, playerHealth);
                document.getElementById('hp-bar').style.width = Math.max(0, playerHealth) + '%';
                document.getElementById('hp-bar').style.background = playerHealth <= 30 ? 'linear-gradient(90deg, #aa0000, #ff0000)' : 'linear-gradient(90deg, #00aa00, #00ff00)';

                // Progression
                killCount++;
                document.getElementById('kill-count').innerText = `KILLS: ${killCount}`;
                
                // Auto Switch Logic
                if (killCount === UNLOCKS.pistol && currentWeaponIdx > 1) switchWeapon(1);
                if (killCount === UNLOCKS.akm && currentWeaponIdx > 0) switchWeapon(0);
                
                updateWeaponUI();
            }
        }
    }

    function enemyShoot(enemy) {
        if (isGameOver) return;
        const startCannon = enemy.body.position.clone();
        startCannon.y += 1.5;
        const endCannon = physicsBody.position.clone();
        const start = new THREE.Vector3(startCannon.x, startCannon.y, startCannon.z);
        const end = new THREE.Vector3(endCannon.x, endCannon.y, endCannon.z);
        end.y += 1.0; // Aim at player's chest, not feet
        const direction = new THREE.Vector3().subVectors(end, start).normalize();
        
        const raycaster = new THREE.Raycaster(start, direction);
        raycaster.far = 50;
        
        const intersects = raycaster.intersectObjects(mapMeshes, true);
        const distToPlayer = start.distanceTo(end);
        
        if (intersects.length > 0 && intersects[0].distance < distToPlayer) return; 

        // Visuals
        // 1. Tracer
        const material = new THREE.LineBasicMaterial({ color: 0xff0000 });
        const points = [start, end];
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(geometry, material);
        scene.add(line);
        setTimeout(() => scene.remove(line), 100);

        // 2. Muzzle Flash (Yellow PointLight)
        const flash = new THREE.PointLight(0xffff00, 2, 5);
        flash.position.copy(start);
        scene.add(flash);
        setTimeout(() => scene.remove(flash), 100);
        
        // 3. Sound
        if (audioBuffers['enemy'] && enemy.sound) {
            if (enemy.sound.isPlaying) enemy.sound.stop();
            enemy.sound.setBuffer(audioBuffers['enemy']);
            enemy.sound.setRefDistance(5);
            enemy.sound.play();
        }

        // Damage Player
        takeDamage(10);
    }
    
    function takeDamage(amount) {
        if (isGameOver) return;
        playerHealth -= amount;
        
        // Update UI
        document.getElementById('hp-val').innerText = Math.max(0, playerHealth);
        document.getElementById('hp-bar').style.width = Math.max(0, playerHealth) + '%';
        document.getElementById('hp-bar').style.background = playerHealth <= 30 ? 'linear-gradient(90deg, #aa0000, #ff0000)' : 'linear-gradient(90deg, #00aa00, #00ff00)';

        // Red Flash
        const overlay = document.getElementById('damage-overlay');
        overlay.style.opacity = '0.8';
        setTimeout(() => overlay.style.opacity = '0', 200);
        
        // Camera Shake
        shakeIntensity = 0.3;

        if (playerHealth <= 0) {
            isGameOver = true;
            document.exitPointerLock(); 
            setTimeout(() => {
                showLeaderboardUI();
            }, 100);
        }
    }

    // --- Leaderboard Logic ---
    async function submitScore(name, score) {
        const hash = md5(score + SECRET_KEY);
        
        // We must send a JSON object, not URLSearchParams
        const payload = {
            gameId: 'Game1',
            name: name,
            score: score,
            hash: hash
        };

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                // This 'mode' and 'contentType' are vital for Google Scripts
                mode: 'no-cors', 
                headers: {
                    'Content-Type': 'text/plain', 
                },
                body: JSON.stringify(payload)
            });
            
            // Note: with 'no-cors', you can't actually read the response text
            // but the data WILL reach the sheet.
            return "Success"; 
        } catch (error) {
            console.error('Error submitting score:', error);
            return 'Error';
        }
    }

    async function getLeaderboard(timeframe = '24h') {
        try {
            const response = await fetch(`${SCRIPT_URL}?gameId=Game1&timeframe=${timeframe}`);
            const data = await response.json();
            return data;
        } catch (error) {
            console.error('Error fetching leaderboard:', error);
            return [];
        }
    }

    async function loadLeaderboardData(timeframe) {
        document.getElementById('leaderboard-body').innerHTML = '<tr><td colspan="3">Loading leaderboard...</td></tr>';
        
        const lbData = await getLeaderboard(timeframe);
        let html = '';
        
        lbData.forEach((entry, idx) => {
            const displayName = entry[0] || "Unknown";
            const displayScore = entry[1] || 0;
            
            html += `<tr>
                        <td>${idx + 1}</td>
                        <td>${displayName}</td>
                        <td>${displayScore}</td>
                    </tr>`;
        });

        if (lbData.length === 0) html = '<tr><td colspan="3">No scores yet!</td></tr>';
        document.getElementById('leaderboard-body').innerHTML = html;
    }

    async function showLeaderboardUI() {
        document.getElementById('leaderboard-modal').style.display = 'flex';
        document.getElementById('leaderboard-section').style.display = 'block';
        document.getElementById('final-score').innerText = killCount;
        
        // Reset tabs to 24h active
        document.querySelectorAll('.lb-tab').forEach(t => t.classList.remove('active'));
        document.querySelector('.lb-tab[data-timeframe="24h"]').classList.add('active');
        
        document.getElementById('leaderboard-body').innerHTML = '<tr><td colspan="3">Submitting score...</td></tr>';
        
        if (playerName) {
            const result = await submitScore(playerName, killCount);
            if (result === 'Inappropriate Name') {
                alert('Inappropriate Name. Please restart and choose another one.');
                document.getElementById('leaderboard-body').innerHTML = '<tr><td colspan="3">Score rejected.</td></tr>';
                return;
            }
        }
        
        await loadLeaderboardData('24h');
    }

    document.querySelectorAll('.lb-tab').forEach(tab => {
        tab.addEventListener('click', async (e) => {
            document.querySelectorAll('.lb-tab').forEach(t => t.classList.remove('active'));
            e.target.classList.add('active');
            const timeframe = e.target.getAttribute('data-timeframe');
            await loadLeaderboardData(timeframe);
        });
    });

    document.getElementById('play-again-btn').addEventListener('click', () => {
        document.getElementById('leaderboard-modal').style.display = 'none';
        resetGame();
        if (!controls.isLocked) {
            controls.lock();
        }
    });

    function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();
        
        world.step(1 / 60, dt, 3);

        if (controls.isLocked && !isGameOver) {
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0;
            forward.normalize();

            const right = new THREE.Vector3();
            right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

            const moveDir = new THREE.Vector3(0, 0, 0);
            if (keys.w) moveDir.add(forward);
            if (keys.s) moveDir.sub(forward);
            if (keys.d) moveDir.add(right);
            if (keys.a) moveDir.sub(right);

            if (moveDir.lengthSq() > 0) {
                moveDir.normalize().multiplyScalar(PLAYER_OPTS.speed);
            }

            physicsBody.velocity.x = moveDir.x;
            physicsBody.velocity.z = moveDir.z;

            if (keys.space && Math.abs(physicsBody.velocity.y) < 0.1) {
                physicsBody.velocity.y = PLAYER_OPTS.jumpForce;
            }
        }

        camera.position.set(physicsBody.position.x, physicsBody.position.y, physicsBody.position.z);
        camera.position.y += 0.6;
        
        // Player out of bounds reset
        if (physicsBody.position.y < -30) {
            physicsBody.position.set(0, 10, 0);
            physicsBody.velocity.set(0, 0, 0);
        }
        
        // Apply Camera Shake (Position Based)
        if (shakeIntensity > 0) {
            camera.position.x += (Math.random() - 0.5) * shakeIntensity;
            camera.position.y += (Math.random() - 0.5) * shakeIntensity;
            shakeIntensity = Math.max(0, shakeIntensity - dt * 0.5);
        }

        const now = Date.now();
        
        // Dynamic Wave Logic
        const aliveCount = enemyBodies.filter(e => e.mesh.visible).length;
        const targetCount = getTargetEnemyCount(killCount);
        
        if (aliveCount < targetCount) {
             const deadEnemy = enemyBodies.find(e => !e.mesh.visible && now > e.deadUntil);
             if (deadEnemy) {
                 respawnEnemy(deadEnemy);
             }
        }

        enemyBodies.forEach(e => {
            // Only update active enemies
            if (e.mesh.visible) {
                 // Check if fell out of bounds
                 if (e.body.position.y < -30) {
                     e.mesh.visible = false;
                     e.deadUntil = 0; // Respawn immediately
                     e.body.position.set(0, -50, 0);
                     e.body.velocity.set(0, 0, 0);
                     return;
                 }

                 e.debugMesh.position.set(e.body.position.x, e.body.position.y, e.body.position.z);
                 e.debugMesh.quaternion.set(e.body.quaternion.x, e.body.quaternion.y, e.body.quaternion.z, e.body.quaternion.w);

                 e.mesh.position.set(e.body.position.x, e.body.position.y, e.body.position.z);
                 e.mesh.position.y -= 0.9;
                 e.mesh.quaternion.set(e.body.quaternion.x, e.body.quaternion.y, e.body.quaternion.z, e.body.quaternion.w);

                 if (!isGameOver) {
                    const dist = new THREE.Vector3(e.body.position.x, e.body.position.y, e.body.position.z).distanceTo(new THREE.Vector3(physicsBody.position.x, physicsBody.position.y, physicsBody.position.z));
                    
                    // Look at player
                    e.mesh.lookAt(camera.position.x, e.mesh.position.y, camera.position.z);
                    
                    if (now - e.spawnTime > 1000 && dist < 40) {
                        if (now - e.lastShot > 1000) {
                            enemyShoot(e);
                            e.lastShot = now;
                        }
                    }
                    
                    // Move towards player
                    if (now - e.spawnTime > 1000) {
                        if (dist >= 17) {
                            // Move towards player
                            const dir = new THREE.Vector3().subVectors(new THREE.Vector3(physicsBody.position.x, physicsBody.position.y, physicsBody.position.z), new THREE.Vector3(e.body.position.x, e.body.position.y, e.body.position.z));
                            dir.y = 0;
                            if (dir.lengthSq() > 0) {
                                dir.normalize();
                                e.body.velocity.x = dir.x * 3.5;
                                e.body.velocity.z = dir.z * 3.5;
                            }
                        } else if (dist >= 11 && dist <= 13) {
                            // Back up
                            const dir = new THREE.Vector3().subVectors(new THREE.Vector3(e.body.position.x, e.body.position.y, e.body.position.z), new THREE.Vector3(physicsBody.position.x, physicsBody.position.y, physicsBody.position.z));
                            dir.y = 0;
                            if (dir.lengthSq() > 0) {
                                dir.normalize();
                                
                                // Prevent phasing through walls while backing up
                                const startPos = new THREE.Vector3(e.body.position.x, e.body.position.y, e.body.position.z);
                                const raycaster = new THREE.Raycaster(startPos, dir);
                                raycaster.far = 1.5; // Check 1.5m behind
                                const intersects = raycaster.intersectObjects(mapMeshes, true);
                                
                                if (intersects.length > 0) {
                                    // Wall behind, stop backing up
                                    e.body.velocity.x = 0;
                                    e.body.velocity.z = 0;
                                } else {
                                    e.body.velocity.x = dir.x * 3.5;
                                    e.body.velocity.z = dir.z * 3.5;
                                }
                            }
                        } else {
                            // Stand ground (dist <= 10, or 13 < dist < 17)
                            e.body.velocity.x = 0;
                            e.body.velocity.z = 0;
                        }
                    } else {
                        // Spawn delay - don't move
                        e.body.velocity.x = 0;
                        e.body.velocity.z = 0;
                    }
                 }
            }
        });

        renderer.render(scene, camera);
    }

    function onKeyDown(event) {
        if (isGameOver) return;
        switch (event.code) {
            case 'KeyW': keys.w = true; break;
            case 'KeyA': keys.a = true; break;
            case 'KeyS': keys.s = true; break;
            case 'KeyD': keys.d = true; break;
            case 'Space': keys.space = true; break;
            case 'Digit1': switchWeapon(0); break;
            case 'Digit2': switchWeapon(1); break;
            case 'Digit3': switchWeapon(2); break;
        }
    }

    function onKeyUp(event) {
        switch (event.code) {
            case 'KeyW': keys.w = false; break;
            case 'KeyA': keys.a = false; break;
            case 'KeyS': keys.s = false; break;
            case 'KeyD': keys.d = false; break;
            case 'Space': keys.space = false; break;
        }
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    init();

</script>
